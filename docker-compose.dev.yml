# Dev-mode overrides for docker compose. Merged on top of docker-compose.yml
# when used with `-f docker-compose.yml -f docker-compose.dev.yml` (the
# `docker:watch` npm script does this for you).
#
# It bind-mounts the source folders so edits on the host are instantly
# visible inside the container, and swaps the command to `bun --hot` so the
# server reloads when src/server/* (or anything it imports) changes.
#
# Note: this only hot-reloads the *server*. Client-side changes
# (src/client/**) still need `bun run build:client` on the host to
# regenerate public/dist — the container just sees whatever is already
# there via the bind mount.
services:
  five-o:
    command: ["bun", "--hot", "run", "src/server/index.ts"]
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
