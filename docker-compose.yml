services:
  five-o:
    build: .
    image: five-o:latest
    container_name: five-o
    restart: unless-stopped

    # Rootless Docker maps container uid 0 to the host user `dev`, which owns
    # the bind-mounted ./data. The image's `bun` user (uid 1000) maps into
    # dev's subuid range instead, so it sees the DB as root-owned 0644 and
    # SQLite fails with SQLITE_READONLY. Container-root here *is* unprivileged
    # `dev` on the host, and it keeps ./data readable for host-side backups.
    user: "0:0"

    # Bind to loopback so the container is only reachable from the host.
    # Drop the `127.0.0.1:` prefix if you want it reachable directly.
    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - ./data:/data

    # Secrets live in a host-only .env file (copy .env.example, fill it in,
    # keep DB_PATH/BACKUPS_DIR pointed at /data since that's the volume).
    env_file:
      - path: .env
        required: false
